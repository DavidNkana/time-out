<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!--
    Kitchen & Dining category card.
    Soft-pink gradient + stylized ceramic plate, fork, knife and a kettle.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FBE9EE"/>
      <stop offset="60%"  stop-color="#F7D4DC"/>
      <stop offset="100%" stop-color="#E8A0AE"/>
    </linearGradient>
    <linearGradient id="kettle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FAF6F4"/>
      <stop offset="100%" stop-color="#C9C5BD"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Decorative dots -->
  <g fill="#FAF6F4" opacity="0.18">
    <circle cx="80"  cy="100" r="6"/>
    <circle cx="540" cy="120" r="8"/>
    <circle cx="60"  cy="360" r="5"/>
    <circle cx="510" cy="420" r="6"/>
  </g>

  <!-- Plate (oval, 3/4 view, foreground bottom) -->
  <ellipse cx="300" cy="440" rx="160" ry="22" fill="#9D988E" opacity="0.45"/>
  <ellipse cx="300" cy="430" rx="160" ry="38" fill="#FAF6F4" stroke="#9D988E" stroke-width="2.5"/>
  <ellipse cx="300" cy="424" rx="120" ry="28" fill="none" stroke="#C9C5BD" stroke-width="1.5"/>
  <ellipse cx="300" cy="420" rx="90"  ry="20" fill="none" stroke="#C9C5BD" stroke-width="1.2"/>

  <!-- Fork on the left of the plate -->
  <g stroke="#706B62" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="120" y1="270" x2="120" y2="425"/>
    <!-- Tines -->
    <line x1="120" y1="270" x2="105" y2="244"/>
    <line x1="120" y1="270" x2="115" y2="240"/>
    <line x1="120" y1="270" x2="125" y2="240"/>
    <line x1="120" y1="270" x2="135" y2="244"/>
  </g>
  <!-- Fork handle highlight -->
  <rect x="116" y="280" width="8" height="140" fill="#9D988E" opacity="0.4"/>

  <!-- Knife on the right of the plate -->
  <g stroke="#706B62" stroke-width="3" fill="none" stroke-linecap="round">
    <line x1="480" y1="290" x2="480" y2="425"/>
    <!-- Blade -->
    <path d="M 480 290 L 460 250 L 480 240 Z" fill="#9D988E" opacity="0.6" stroke="#706B62" stroke-width="2"/>
  </g>

  <!-- Kettle (top right corner, sitting on imaginary counter) -->
  <g>
    <!-- Kettle body -->
    <ellipse cx="430" cy="350" rx="64" ry="56" fill="url(#kettle)" stroke="#9D988E" stroke-width="2.5"/>
    <!-- Lid -->
    <ellipse cx="430" cy="298" rx="30" ry="6" fill="#FAF6F4" stroke="#9D988E" stroke-width="2"/>
    <ellipse cx="430" cy="294" rx="10" ry="4" fill="#706B62"/>
    <!-- Spout -->
    <path d="M 488 326 Q 530 308 530 280 L 522 280 Q 518 300 484 338 Z"
          fill="url(#kettle)" stroke="#9D988E" stroke-width="2"/>
    <!-- Handle -->
    <path d="M 372 320 Q 348 350 372 380"
          fill="none" stroke="#706B62" stroke-width="6" stroke-linecap="round"/>
    <!-- Body highlight -->
    <path d="M 396 320 Q 388 350 396 380" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.5"/>
    <!-- Body band -->
    <ellipse cx="430" cy="380" rx="56" ry="6" fill="#C9C5BD" opacity="0.5"/>
  </g>

  <!-- Steam from the spout -->
  <g stroke="#FAF6F4" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M 528 280 Q 522 260 532 240 Q 542 220 530 200"/>
    <path d="M 514 280 Q 508 264 516 248"/>
  </g>

  <!-- Small bowl in the centre of the plate -->
  <ellipse cx="300" cy="410" rx="46" ry="12" fill="#E8A0AE" opacity="0.85"/>
  <ellipse cx="300" cy="404" rx="40" ry="9"  fill="#D17585"/>

  <!-- Floor band -->
  <rect y="500" width="600" height="100" fill="#D8C5B5" opacity="0.4"/>

  <!-- Category label -->
  <text x="300" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="600" fill="#FAF6F4" letter-spacing="-0.5">KITCHEN &amp; DINING</text>
  <text x="300" y="585" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FAF6F4" letter-spacing="3" opacity="0.85">COOKWARE &amp; TABLEWARE</text>
</svg>
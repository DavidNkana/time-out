<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!--
    Bedding category card.
    Soft-pink gradient + stylized stacked pillows and a folded throw.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FBE9EE"/>
      <stop offset="55%"  stop-color="#F0B7C1"/>
      <stop offset="100%" stop-color="#D17585"/>
    </linearGradient>
    <linearGradient id="pillow1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FAF6F4"/>
      <stop offset="100%" stop-color="#E8A0AE"/>
    </linearGradient>
    <linearGradient id="pillow2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#C9C5BD"/>
      <stop offset="100%" stop-color="#9D988E"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Decorative dots -->
  <g fill="#FAF6F4" opacity="0.18">
    <circle cx="80"  cy="120" r="6"/>
    <circle cx="540" cy="100" r="8"/>
    <circle cx="60"  cy="380" r="5"/>
    <circle cx="510" cy="420" r="6"/>
    <circle cx="100" cy="470" r="7"/>
  </g>

  <!-- Folded throw (bottom layer) -->
  <rect x="120" y="430" width="360" height="50" rx="6" fill="#9D988E" stroke="#706B62" stroke-width="2"/>
  <rect x="120" y="430" width="360" height="10" fill="#706B62" opacity="0.55"/>
  <!-- Throw tassels on the right -->
  <g stroke="#706B62" stroke-width="2" fill="none" stroke-linecap="round">
    <line x1="468" y1="438" x2="478" y2="478"/>
    <line x1="476" y1="438" x2="484" y2="476"/>
    <line x1="484" y1="438" x2="490" y2="476"/>
    <line x1="492" y1="438" x2="496" y2="476"/>
  </g>
  <!-- Throw stripe accent -->
  <line x1="120" y1="460" x2="480" y2="460" stroke="#FAF6F4" stroke-width="2" opacity="0.55"/>

  <!-- Large pillow (back layer, lying flat) -->
  <rect x="140" y="290" width="320" height="150" rx="36" fill="url(#pillow2)" stroke="#706B62" stroke-width="2.5"/>
  <!-- Inner tufting circle -->
  <ellipse cx="300" cy="365" rx="80" ry="44" fill="none" stroke="#706B62" stroke-width="1.5" opacity="0.55"/>

  <!-- Smaller pillow (front-left, propped up, slightly rotated) -->
  <g transform="rotate(-8 230 320)">
    <rect x="150" y="240" width="170" height="120" rx="24" fill="url(#pillow1)" stroke="#9D988E" stroke-width="2.5"/>
    <!-- Pillow seam -->
    <rect x="162" y="252" width="146" height="96" rx="18" fill="none" stroke="#9D988E" stroke-width="1.2" opacity="0.55"/>
  </g>

  <!-- Smaller pillow (front-right, propped up, rotated other way) -->
  <g transform="rotate(10 400 320)">
    <rect x="320" y="240" width="170" height="120" rx="24" fill="#D17585" stroke="#9D988E" stroke-width="2.5"/>
    <!-- Pillow button -->
    <circle cx="405" cy="300" r="6" fill="#FAF6F4" stroke="#706B62" stroke-width="1.5"/>
    <line x1="405" y1="280" x2="405" y2="320" stroke="#9D988E" stroke-width="1" opacity="0.55"/>
    <line x1="385" y1="300" x2="425" y2="300" stroke="#9D988E" stroke-width="1" opacity="0.55"/>
  </g>

  <!-- Sleep mask on top of pillows -->
  <g transform="translate(260 188)">
    <path d="M 0 30 Q 0 0 40 0 Q 80 0 80 30 L 80 60 Q 80 80 60 80 L 20 80 Q 0 80 0 60 Z"
          fill="#706B62" stroke="#3F3D38" stroke-width="2"/>
    <!-- Strap -->
    <path d="M 80 30 Q 140 20 140 50 Q 140 80 80 70" fill="none" stroke="#3F3D38" stroke-width="2.5"/>
    <circle cx="40" cy="40" r="10" fill="#FAF6F4" opacity="0.4"/>
  </g>

  <!-- Floor band -->
  <rect y="500" width="600" height="100" fill="#B89A85" opacity="0.4"/>

  <!-- Category label -->
  <text x="300" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="600" fill="#FAF6F4" letter-spacing="-1">BEDDING</text>
  <text x="300" y="585" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FAF6F4" letter-spacing="3" opacity="0.85">LINENS &amp; THROWS</text>
</svg>
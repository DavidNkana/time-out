<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <!--
    Women's Fashion category card.
    Soft-pink gradient + stylized dress on a hanger.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FBE9EE"/>
      <stop offset="55%"  stop-color="#F0B7C1"/>
      <stop offset="100%" stop-color="#D17585"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#FAF6F4"/>
      <stop offset="100%" stop-color="#E8A0AE"/>
    </linearGradient>
  </defs>

  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- Decorative dots (subtle pattern) -->
  <g fill="#FAF6F4" opacity="0.18">
    <circle cx="80" cy="80" r="6"/>
    <circle cx="540" cy="100" r="8"/>
    <circle cx="120" cy="500" r="7"/>
    <circle cx="500" cy="510" r="6"/>
    <circle cx="60" cy="300" r="5"/>
  </g>

  <!-- Hanger hook -->
  <path d="M 300 80 Q 300 60 320 60 Q 340 60 340 80 Q 340 95 325 100 L 325 130"
        fill="none" stroke="#706B62" stroke-width="4" stroke-linecap="round"/>

  <!-- Hanger arms -->
  <path d="M 325 130 Q 200 145 175 180 M 325 130 Q 450 145 475 180"
        fill="none" stroke="#706B62" stroke-width="3" stroke-linecap="round"/>

  <!-- Dress silhouette (wrap style with tie waist) -->
  <!-- Bodice top -->
  <path d="M 260 180 Q 290 168 325 168 Q 360 168 390 180
           L 400 230 Q 380 250 360 245
           L 360 290 Q 380 300 410 305
           L 470 470 Q 460 478 450 478
           L 200 478 Q 190 478 180 470
           L 240 305 Q 270 300 290 290
           L 290 245 Q 270 250 250 230 Z"
        fill="url(#dress)" stroke="#9D988E" stroke-width="2"/>

  <!-- V-neck -->
  <path d="M 290 168 Q 310 200 325 215 Q 340 200 360 168"
        fill="#F0B7C1" stroke="#9D988E" stroke-width="1.5"/>

  <!-- Waist tie -->
  <line x1="290" y1="290" x2="360" y2="290" stroke="#9D988E" stroke-width="2.5"/>
  <path d="M 290 290 Q 280 320 270 360" fill="none" stroke="#9D988E" stroke-width="3" stroke-linecap="round"/>
  <path d="M 360 290 Q 370 320 380 360" fill="none" stroke="#9D988E" stroke-width="3" stroke-linecap="round"/>

  <!-- Subtle fabric folds -->
  <g stroke="#9D988E" stroke-width="1" opacity="0.35" fill="none">
    <path d="M 240 320 Q 245 400 230 470"/>
    <path d="M 280 320 Q 285 400 275 470"/>
    <path d="M 320 320 Q 320 400 320 470"/>
    <path d="M 360 320 Q 360 400 360 470"/>
    <path d="M 400 320 Q 400 400 410 470"/>
  </g>

  <!-- Floor band -->
  <rect y="500" width="600" height="100" fill="#B89A85" opacity="0.4"/>

  <!-- Category label -->
  <text x="300" y="555" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="600" fill="#FAF6F4" letter-spacing="-0.5">WOMEN&apos;S FASHION</text>
  <text x="300" y="585" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FAF6F4" letter-spacing="3" opacity="0.85">CLOTHING &amp; ACCESSORIES</text>
</svg>
